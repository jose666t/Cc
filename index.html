
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW CC - PREMIUM MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
        
        :root {
            --neon: #00ff41;
            --bg: #050505;
            --accent: #ff3131;
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Share Tech Mono', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        .terminal-font { font-family: 'VT323', monospace; }

        .hacker-card {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
        }

        .hacker-card:hover {
            border-color: var(--neon);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.2);
        }

        input, select {
            background: #000 !important;
            border: 1px solid #333 !important;
            color: var(--neon) !important;
            outline: none;
        }

        input:focus {
            border-color: var(--neon) !important;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.05);
            position: fixed;
            top: 0;
            z-index: 9999;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .nav-link.active {
            color: white;
            border-top: 2px solid var(--neon);
            text-shadow: 0 0 10px var(--neon);
            opacity: 1;
        }
    </style>
</head>
<body class="pb-24 overflow-x-hidden">

    <div class="scanline"></div>

    <!-- NOTIFICACIONES -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[10000] w-full max-w-xs space-y-2"></div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-zinc-900 border-t-[#00ff41] rounded-full animate-spin mb-4"></div>
        <div class="terminal-font text-xl tracking-widest uppercase animate-pulse">Establishing Secure Connection...</div>
    </div>

    <!-- VISTA DE AUTENTICACIÓN -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="hacker-card w-full max-w-md p-8 rounded-2xl">
            <div class="text-center mb-8">
                <div class="text-5xl mb-2">💀</div>
                <h1 class="terminal-font text-4xl tracking-tighter">SHADOW CC</h1>
                <p class="text-[10px] opacity-40 uppercase tracking-widest mt-1">Nivel de Seguridad: Encriptado</p>
            </div>

            <div class="flex gap-4 mb-6 border-b border-zinc-900">
                <button onclick="setAuth('login')" id="t-login" class="flex-1 pb-2 text-sm font-bold border-b-2 border-[#00ff41]">LOGIN</button>
                <button onclick="setAuth('signup')" id="t-signup" class="flex-1 pb-2 text-sm font-bold border-b-2 border-transparent opacity-40">SIGNUP</button>
            </div>

            <div class="space-y-4">
                <input type="email" id="email" placeholder="Correo Electrónico" class="w-full p-4 rounded-lg">
                <input type="password" id="pass" placeholder="Contraseña" class="w-full p-4 rounded-lg">
                <button onclick="handleAuthAction()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-lg uppercase transition-all active:scale-95">Acceder al Terminal</button>
                
                <div class="relative py-2 flex items-center">
                    <div class="flex-grow border-t border-zinc-900"></div>
                    <span class="px-3 text-[10px] opacity-40">O CONTINUAR CON</span>
                    <div class="flex-grow border-t border-zinc-900"></div>
                </div>

                <button onclick="loginGoogle()" class="w-full bg-white text-black font-bold p-4 rounded-lg flex items-center justify-center gap-3 active:scale-95 transition-all">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> Google Account
                </button>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="view-app" class="hidden">
        <header class="p-5 border-b border-zinc-900 sticky top-0 bg-black/90 backdrop-blur z-50 flex justify-between items-center">
            <div>
                <h1 class="terminal-font text-2xl tracking-widest text-[#00ff41]">SHADOW CC</h1>
                <div id="user-tag" class="text-[9px] opacity-40 truncate max-w-[140px] uppercase"></div>
            </div>
            <div class="text-[#ff3131] text-2xl animate-pulse">⚡</div>
        </header>

        <main class="p-4">
            <!-- SECCIÓN: TIENDA -->
            <section id="sec-store" class="subview">
                <div class="mb-6">
                    <input type="text" id="search" onkeyup="filterStock(this.value)" placeholder="Filtrar por BIN, País o Ciudad..." class="w-full p-4 rounded-xl">
                </div>
                <div id="marketplace-grid" class="grid grid-cols-1 gap-4">
                    <!-- Cards de CC se inyectan aquí -->
                </div>
            </section>

            <!-- SECCIÓN: ADMINISTRACIÓN -->
            <section id="sec-admin" class="subview hidden">
                <div id="admin-login" class="hacker-card p-8 rounded-2xl text-center">
                    <h2 class="terminal-font text-2xl mb-4">ADMIN ACCESS REQUIRED</h2>
                    <input type="password" id="admin-key" placeholder="Password Maestro" class="w-full p-4 rounded-lg text-center mb-6 tracking-[10px]">
                    <button onclick="unlockAdmin()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-lg uppercase">Desbloquear Panel</button>
                </div>

                <div id="admin-panel" class="hidden space-y-6">
                    <div class="hacker-card p-6 rounded-2xl">
                        <h3 class="text-white text-xs font-bold mb-6 uppercase border-b border-zinc-800 pb-2">Registrar Nuevo Stock</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] opacity-50 ml-1">BIN (6-8 DÍGITOS)</label>
                                <input type="text" id="in-bin" placeholder="4003 4499" class="w-full p-3 rounded-lg">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] opacity-50 ml-1">PAÍS</label>
                                    <input type="text" id="in-country" placeholder="USA 🇺🇸" class="w-full p-3 rounded-lg">
                                </div>
                                <div>
                                    <label class="text-[10px] opacity-50 ml-1">CIUDAD</label>
                                    <input type="text" id="in-city" placeholder="Lecanto, FL" class="w-full p-3 rounded-lg">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] opacity-50 ml-1">FECHA (MM/YY)</label>
                                    <input type="text" id="in-date" placeholder="05/28" class="w-full p-3 rounded-lg">
                                </div>
                                <div>
                                    <label class="text-[10px] opacity-50 ml-1">PRECIO ($)</label>
                                    <input type="text" id="in-price" placeholder="25.00" class="w-full p-3 rounded-lg">
                                </div>
                            </div>
                            <button onclick="addStockToCloud()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-lg uppercase mt-2">Publicar en la Nube</button>
                        </div>
                    </div>

                    <div class="hacker-card p-6 rounded-2xl">
                        <h3 class="text-white text-xs font-bold mb-2 uppercase">Configuración de Venta</h3>
                        <div class="flex gap-2">
                            <input type="text" id="config-phone" placeholder="50582269592" class="flex-1 p-3 rounded-lg">
                            <button onclick="savePhone()" class="bg-zinc-800 px-4 rounded-lg font-bold text-xs uppercase">Guardar</button>
                        </div>
                    </div>

                    <div id="admin-inventory-list" class="space-y-2">
                        <!-- Items para borrar -->
                    </div>
                </div>
            </section>
        </main>

        <!-- BARRA DE NAVEGACIÓN INFERIOR -->
        <nav class="fixed bottom-0 left-0 w-full bg-black border-t border-zinc-900 flex justify-around p-4 z-50">
            <button onclick="changeView('store')" id="nav-store" class="nav-link active flex flex-col items-center gap-1 opacity-40">
                <span class="text-xl">🛒</span>
                <span class="text-[10px] font-bold">STOCK</span>
            </button>
            <button onclick="changeView('admin')" id="nav-admin" class="nav-link flex flex-col items-center gap-1 opacity-40">
                <span class="text-xl">🛡️</span>
                <span class="text-[10px] font-bold">PANEL</span>
            </button>
            <button onclick="handleLogout()" class="flex flex-col items-center gap-1 opacity-40 text-[#ff3131]">
                <span class="text-xl">🚪</span>
                <span class="text-[10px] font-bold">SALIR</span>
            </button>
        </nav>
    </div>

    <!-- MODAL DE PEDIDO -->
    <div id="modal-order" class="fixed inset-0 bg-black/98 z-[6000] hidden items-center justify-center p-6">
        <div class="hacker-card w-full max-w-sm p-8 rounded-2xl">
            <h2 class="text-white font-bold text-xl mb-4 border-b border-zinc-900 pb-2 terminal-font tracking-widest">DETALLES DE ORDEN</h2>
            <div id="modal-content-info" class="bg-zinc-900/40 p-5 rounded-lg mb-6 text-sm space-y-2 font-mono"></div>
            
            <label class="text-[10px] opacity-40 mb-1 block">CONFIRMAR CIUDAD DE ENVÍO:</label>
            <input type="text" id="order-city-input" placeholder="Tu Ciudad" class="w-full p-4 rounded-lg mb-6">
            
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-zinc-900 text-white p-4 rounded-lg font-bold transition-all active:bg-zinc-800">CERRAR</button>
                <button onclick="sendToWhatsApp()" class="flex-[2] bg-[#00ff41] text-black p-4 rounded-lg font-bold uppercase transition-all active:scale-95">Confirmar WhatsApp</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC17dzIZSZtMbzu5V7dIHWdm6nDmoBN-KY",
            authDomain: "shadow-music-f033d.firebaseapp.com",
            projectId: "shadow-music-f033d",
            storageBucket: "shadow-music-f033d.firebasestorage.app",
            messagingSenderId: "358954790180",
            appId: "1:358954790180:web:ef7abfb3fc45b291d657b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_UID = "shadow-cc-v3";

        let authMode = 'login', user = null, stock = [], config = { phone: "50582269592", pass: "admin123" }, currentOrder = null;

        // --- NOTIFICACIONES ---
        window.notify = (msg, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg text-[11px] font-bold border ${isError ? 'bg-red-900/90 border-red-500 text-white' : 'bg-black/90 border-[#00ff41] text-[#00ff41]'} shadow-xl animate-bounce`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        // --- AUTH ---
        window.setAuth = (mode) => {
            authMode = mode;
            document.getElementById('t-login').className = mode === 'login' ? 'flex-1 pb-2 text-sm font-bold border-b-2 border-[#00ff41]' : 'flex-1 pb-2 text-sm font-bold border-b-2 border-transparent opacity-40';
            document.getElementById('t-signup').className = mode === 'signup' ? 'flex-1 pb-2 text-sm font-bold border-b-2 border-[#00ff41]' : 'flex-1 pb-2 text-sm font-bold border-b-2 border-transparent opacity-40';
        };

        window.handleAuthAction = async () => {
            const email = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!email || !p) return notify("Datos incompletos", true);
            try { authMode === 'login' ? await signInWithEmailAndPassword(auth, email, p) : await createUserWithEmailAndPassword(auth, email, p); }
            catch(err) { notify(err.message, true); }
        };

        window.loginGoogle = async () => {
            try { await signInWithPopup(auth, new GoogleAuthProvider()); }
            catch(err) { notify("Error Google: Dominio no autorizado", true); }
        };

        window.handleLogout = () => signOut(auth);

        // --- APP STATE ---
        onAuthStateChanged(auth, (u) => {
            user = u;
            document.getElementById('loading').style.display = 'none';
            if(u) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                document.getElementById('user-tag').innerText = `USER: ${u.email}`;
                syncCloud();
            } else {
                document.getElementById('view-app').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        });

        function syncCloud() {
            // Configuración
            onSnapshot(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), (s) => {
                if(s.exists()) {
                    config = s.data();
                    document.getElementById('config-phone').value = config.phone;
                } else {
                    setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), config);
                }
            });

            // Inventario Realtime
            onSnapshot(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), (s) => {
                stock = s.docs.map(d => ({id: d.id, ...d.data()}));
                renderStoreGrid();
                renderAdminView();
            }, (e) => notify("Reglas de Seguridad Bloqueadas", true));
        }

        // --- VIEWS ---
        window.changeView = (v) => {
            document.querySelectorAll('.subview').forEach(x => x.classList.add('hidden'));
            document.getElementById('sec-'+v).classList.remove('hidden');
            document.getElementById('nav-store').className = v === 'store' ? 'nav-link active flex flex-col items-center gap-1 transition-all' : 'nav-link flex flex-col items-center gap-1 opacity-40 transition-all';
            document.getElementById('nav-admin').className = v === 'admin' ? 'nav-link active flex flex-col items-center gap-1 transition-all' : 'nav-link flex flex-col items-center gap-1 opacity-40 transition-all';
        };

        function renderStoreGrid() {
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = stock.length ? '' : '<div class="text-center py-20 opacity-20 text-xs">NO_STOCK_IN_CLOUD</div>';
            stock.forEach(item => {
                grid.innerHTML += `
                    <div class="hacker-card rounded-xl overflow-hidden">
                        <div class="bg-[#00ff41] text-black text-[9px] font-bold px-3 py-1 flex justify-between">
                            <span>VERIFIED_SYSTEM</span><span>ESTADO: DISPONIBLE</span>
                        </div>
                        <div class="p-5">
                            <span class="text-2xl text-white block mb-3 tracking-widest font-bold">${item.bin}xxxx</span>
                            <div class="space-y-1 text-[11px] opacity-60">
                                <div class="flex justify-between"><span>CIUDAD:</span> <span class="text-white">${item.city}</span></div>
                                <div class="flex justify-between"><span>FECHA:</span> <span class="text-white">${item.expDate}</span></div>
                                <div class="flex justify-between"><span>PAÍS:</span> <span class="text-white">${item.country}</span></div>
                            </div>
                            <div class="text-right text-[#ff3131] font-bold text-xl mt-4 border-t border-zinc-900 pt-3">$ ${item.price}</div>
                            <button onclick="openCheckout('${item.id}')" class="w-full border border-[#00ff41] text-[#00ff41] p-3 rounded-lg font-bold text-[10px] mt-4 uppercase tracking-widest active:bg-[#00ff41] active:text-black">ORDENAR ACCESO</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- ADMIN ACTIONS ---
        window.unlockAdmin = () => {
            if(document.getElementById('admin-key').value === config.pass) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else { notify("Acceso Denegado: Key Incorrecta", true); }
        };

        window.addStockToCloud = async () => {
            const bin = document.getElementById('in-bin').value;
            const country = document.getElementById('in-country').value;
            const city = document.getElementById('in-city').value;
            const expDate = document.getElementById('in-date').value;
            const price = document.getElementById('in-price').value;

            if(!bin || !price || !city || !expDate) return notify("Completa todos los campos requeridos", true);

            try {
                await addDoc(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), {
                    bin, country, city, expDate, price, timestamp: Date.now()
                });
                notify("CC registrada exitosamente");
                document.getElementById('in-bin').value = '';
                document.getElementById('in-price').value = '';
                document.getElementById('in-city').value = '';
                document.getElementById('in-date').value = '';
            } catch (e) { notify("Error Firestore: Verifique Reglas", true); }
        };

        window.deleteCC = async (id) => {
            if(confirm("¿Eliminar este item del servidor?")) {
                await deleteDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'stock', id));
                notify("Item eliminado");
            }
        };

        function renderAdminView() {
            const list = document.getElementById('admin-inventory-list');
            list.innerHTML = '<h4 class="text-[9px] opacity-30 mt-4 uppercase tracking-tighter">Administrar Inventario</h4>';
            stock.forEach(item => {
                list.innerHTML += `
                    <div class="bg-zinc-900/50 p-3 rounded-lg flex justify-between items-center text-[10px] border border-zinc-800">
                        <span>${item.bin} - ${item.city} (${item.country})</span>
                        <button onclick="deleteCC('${item.id}')" class="text-[#ff3131] font-bold px-3">X</button>
                    </div>
                `;
            });
        }

        window.savePhone = async () => {
            const phone = document.getElementById('config-phone').value.replace(/\D/g, '');
            await setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), { ...config, phone });
            notify("Teléfono actualizado");
        };

        // --- FLOW PEDIDO ---
        window.openCheckout = (id) => {
            currentOrder = stock.find(i => i.id === id);
            document.getElementById('modal-content-info').innerHTML = `
                <div class="flex justify-between"><span>BIN:</span> <span class="text-[#00ff41]">${currentOrder.bin}xxxx</span></div>
                <div class="flex justify-between"><span>CIUDAD:</span> <span class="text-white">${currentOrder.city}</span></div>
                <div class="flex justify-between"><span>FECHA:</span> <span class="text-white">${currentOrder.expDate}</span></div>
                <div class="flex justify-between"><span>PAÍS:</span> <span class="text-white">${currentOrder.country}</span></div>
                <div class="text-[#ff3131] mt-3 font-bold text-center text-lg">TOTAL: $${currentOrder.price}</div>
            `;
            document.getElementById('modal-order').classList.remove('hidden');
            document.getElementById('modal-order').classList.add('flex');
        };

        window.closeModal = () => {
            document.getElementById('modal-order').classList.add('hidden');
            document.getElementById('modal-order').classList.remove('flex');
        };

        window.sendToWhatsApp = () => {
            const clientCity = document.getElementById('order-city-input').value;
            if(!clientCity) return notify("Ingresa tu ciudad de envío", true);

            const msg = `⚡ *NUEVA ORDEN - SHADOW CC* ⚡
━━━━━━━━━━━━━━━━━━━━━
╭━━ *𝓓𝓮𝓽𝓪𝓵𝓵𝓮𝓼 𝓭𝓮 𝓵𝓪 𝓣𝓪𝓻𝓳𝓮𝓽𝓪* ━━╮
┃
┃ 📟 *BIN:* ${currentOrder.bin}xxxx
┃ 🏙️ *CIUDAD:* ${currentOrder.city}
┃ 📅 *FECHA:* ${currentOrder.expDate}
┃ 🌍 *PAÍS:* ${currentOrder.country}
┃ 💰 *PRECIO:* $${currentOrder.price}
┃
╰━━━━━━━━━━━━━━━━━━━━╯

╭━━ *𝓘𝓷𝓯𝓸𝓻𝓶𝓪𝓬𝓲𝓸𝓷 𝓭𝓮𝓵 𝓒𝓵𝓲𝓮𝓷𝓽𝓮* ━━╮
┃
┃ 👤 *Email:* ${user.email}
┃ 🏙️ *Ciudad Envío:* ${clientCity}
┃
╰━━━━━━━━━━━━━━━━━━━━╯
━━━━━━━━━━━━━━━━━━━━━
*STATUS: PENDING_CONFIRMATION* 🚩`;

            window.open(`https://api.whatsapp.com/send?phone=${config.phone}&text=${encodeURIComponent(msg)}`, '_blank');
            closeModal();
        };

        window.filterStock = (val) => {
            const term = val.toLowerCase();
            const filtered = stock.filter(i => 
                i.bin.includes(term) || 
                i.country.toLowerCase().includes(term) || 
                i.city.toLowerCase().includes(term)
            );
            
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = filtered.length ? '' : '<div class="text-center py-20 opacity-20">SIN COINCIDENCIAS</div>';
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="hacker-card rounded-xl overflow-hidden">
                        <div class="bg-[#00ff41] text-black text-[9px] font-bold px-3 py-1 flex justify-between">
                            <span>VERIFIED_SYSTEM</span><span>ESTADO: DISPONIBLE</span>
                        </div>
                        <div class="p-5">
                            <span class="text-2xl text-white block mb-3 tracking-widest font-bold">${item.bin}xxxx</span>
                            <div class="space-y-1 text-[11px] opacity-60">
                                <div class="flex justify-between"><span>CIUDAD:</span> <span class="text-white">${item.city}</span></div>
                                <div class="flex justify-between"><span>FECHA:</span> <span class="text-white">${item.expDate}</span></div>
                                <div class="flex justify-between"><span>PAÍS:</span> <span class="text-white">${item.country}</span></div>
                            </div>
                            <div class="text-right text-[#ff3131] font-bold text-xl mt-4 border-t border-zinc-900 pt-3">$ ${item.price}</div>
                            <button onclick="openCheckout('${item.id}')" class="w-full border border-[#00ff41] text-[#00ff41] p-3 rounded-lg font-bold text-[10px] mt-4 uppercase tracking-widest active:bg-[#00ff41] active:text-black">ORDENAR ACCESO</button>
                        </div>
                    </div>
                `;
            });
        };

    </script>
</body>
</html>
