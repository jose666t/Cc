<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW CC - PREMIUM 3D MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --neon: #00ff41;
            --bg: #050505;
            --accent: #ff3131;
            --card-grad: linear-gradient(145deg, #111827 0%, #000000 100%);
            --glow: rgba(0, 255, 65, 0.2);
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .premium-font { font-family: 'Orbitron', sans-serif; }

        /* Fondo de Partículas Sutil */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        /* Título 3D Mejorado */
        .title-3d {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 
                0 1px 0 #ccc, 
                0 2px 0 #c9c9c9, 
                0 3px 0 #bbb, 
                0 4px 0 #b9b9b9, 
                0 5px 0 #aaa, 
                0 6px 1px rgba(0,0,0,.1), 
                0 0 5px rgba(0,0,0,.1), 
                0 1px 3px rgba(0,0,0,.3), 
                0 3px 5px rgba(0,0,0,.2), 
                0 5px 10px rgba(0,0,0,.25), 
                0 10px 10px rgba(0,0,0,.2), 
                0 20px 20px rgba(0,0,0,.15),
                0 0 20px var(--neon);
        }

        /* Contenedor de Perspectiva para las Tarjetas */
        .card-container {
            perspective: 1200px;
        }

        /* Tarjeta Física 3D */
        .cc-visual {
            aspect-ratio: 1.58 / 1;
            background: var(--card-grad);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); }
            50% { transform: translateY(-15px) rotateX(2deg) rotateY(-1deg); }
        }

        /* Brillo Holográfico que se mueve */
        .cc-visual::before {
            content: '';
            position: absolute;
            top: -150%; left: -150%;
            width: 300%; height: 300%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.08) 48%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.08) 52%,
                transparent 55%
            );
            transform: rotate(-20deg);
            animation: shine 8s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(-20deg); }
            20%, 100% { transform: translateX(100%) rotate(-20deg); }
        }

        .cc-chip {
            width: 50px; height: 38px;
            background: linear-gradient(135deg, #f3d060 0%, #d4af37 50%, #8a6d1c 100%);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .cc-chip::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(0,0,0,0.2);
            background: repeating-linear-gradient(90deg, transparent 0, transparent 8px, rgba(0,0,0,0.1) 9px);
            border-radius: 4px;
        }

        .hacker-card {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 65, 0.1);
            transition: all 0.4s ease;
        }

        .hacker-card:hover {
            border-color: var(--neon);
            background: rgba(15, 15, 15, 0.9);
            box-shadow: 0 0 30px var(--glow);
        }

        input, select {
            background: rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: var(--neon) !important;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--neon) !important;
            box-shadow: 0 0 15px var(--glow);
        }

        .nav-link.active {
            color: #fff;
            text-shadow: 0 0 15px var(--neon);
            transform: translateY(-3px);
            opacity: 1;
        }

        /* Scanline Animado */
        .scanline {
            width: 100%; height: 4px;
            background: linear-gradient(to bottom, transparent, var(--neon), transparent);
            position: fixed; top: 0; z-index: 9999; opacity: 0.1;
            pointer-events: none; animation: scan 8s linear infinite;
        }
        @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

        /* Botón de compra con efecto */
        .btn-buy {
            background: var(--neon);
            color: #000;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-buy:active { transform: scale(0.92); }
        .btn-buy::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .btn-buy:hover::after { left: 100%; }
    </style>
</head>
<body class="pb-24">

    <canvas id="bg-canvas"></canvas>
    <div class="scanline"></div>
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[10000] w-full max-w-xs space-y-2 px-4"></div>

    <!-- CARGA -->
    <div id="loading" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="relative w-20 h-20 mb-8">
            <div class="absolute inset-0 border-4 border-zinc-900 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-t-[#00ff41] rounded-full animate-spin"></div>
        </div>
        <div class="premium-font text-xs tracking-[0.5em] uppercase animate-pulse text-white">Shadow Terminal Initializing</div>
    </div>

    <!-- AUTH VIEW -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="hacker-card w-full max-w-md p-10 rounded-[40px] border-t-4 border-t-[#00ff41]">
            <div class="text-center mb-12">
                <div class="inline-block p-4 rounded-3xl bg-zinc-900 mb-6 border border-white/5">
                    <span class="text-5xl">💳</span>
                </div>
                <h1 class="premium-font text-4xl title-3d mb-2">SHADOW <span class="text-[#00ff41]">CC</span></h1>
                <p class="text-[9px] opacity-40 uppercase tracking-[0.5em]">Mercado Encriptado v3.5</p>
            </div>

            <div class="flex gap-4 mb-8 bg-black/40 p-1 rounded-2xl">
                <button onclick="setAuth('login')" id="t-login" class="flex-1 py-3 text-[10px] font-black rounded-xl transition-all border-b-2 border-[#00ff41]">ACCEDER</button>
                <button onclick="setAuth('signup')" id="t-signup" class="flex-1 py-3 text-[10px] font-black rounded-xl transition-all opacity-30">REGISTRO</button>
            </div>

            <div class="space-y-4">
                <input type="email" id="email" placeholder="Terminal ID (Email)" class="w-full p-5 rounded-2xl text-sm">
                <input type="password" id="pass" placeholder="Seguridad (Password)" class="w-full p-5 rounded-2xl text-sm">
                <button onclick="handleAuthAction()" class="btn-buy w-full p-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-[#00ff41]/20">Validar Acceso</button>
                
                <div class="flex items-center gap-4 py-4">
                    <div class="h-px bg-white/10 flex-1"></div>
                    <span class="text-[8px] opacity-20 uppercase font-bold">Protocolo Seguro</span>
                    <div class="h-px bg-white/10 flex-1"></div>
                </div>

                <button onclick="loginGoogle()" class="w-full bg-white text-black font-black p-5 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-all text-xs">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> GOOGLE AUTH
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="view-app" class="hidden">
        <header class="p-6 border-b border-white/5 sticky top-0 bg-black/60 backdrop-blur-2xl z-50 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#00ff41]/10 rounded-xl flex items-center justify-center border border-[#00ff41]/20">
                    <span class="text-lg">💳</span>
                </div>
                <div>
                    <h1 class="premium-font text-lg font-black text-white tracking-tighter">SHADOW <span class="text-[#00ff41]">CC</span></h1>
                    <div id="user-tag" class="text-[8px] opacity-40 font-bold uppercase tracking-widest"></div>
                </div>
            </div>
            <div class="bg-zinc-900/80 px-4 py-2 rounded-full border border-white/5 flex items-center gap-3">
                <div class="w-1.5 h-1.5 rounded-full bg-[#00ff41] animate-pulse shadow-[0_0_8px_#00ff41]"></div>
                <span class="text-[9px] text-zinc-400 font-black uppercase">Live Market</span>
            </div>
        </header>

        <main class="p-6 max-w-6xl mx-auto">
            <!-- STORE -->
            <section id="sec-store" class="subview space-y-8">
                <div class="relative group">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-xl opacity-30 group-focus-within:opacity-100 transition-opacity">🔍</span>
                    <input type="text" id="search" onkeyup="filterStock(this.value)" placeholder="Filtrar por BIN, Ciudad o País..." class="w-full p-5 pl-14 rounded-3xl border-none ring-1 ring-white/5 focus:ring-[#00ff41]/40 text-sm">
                </div>

                <div id="marketplace-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Se inyectan las CCs aquí -->
                </div>
            </section>

            <!-- ADMIN -->
            <section id="sec-admin" class="subview hidden">
                <div id="admin-login" class="hacker-card p-12 rounded-[40px] text-center max-w-md mx-auto">
                    <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl">🔐</div>
                    <h2 class="premium-font text-xl mb-2 text-white font-bold">ROOT ACCESS</h2>
                    <p class="text-[9px] opacity-30 uppercase mb-8 tracking-widest">Ingrese credenciales de administrador</p>
                    <input type="password" id="admin-key" placeholder="••••••••" class="w-full p-5 rounded-2xl text-center mb-6 tracking-[10px] text-xl">
                    <button onclick="unlockAdmin()" class="w-full bg-[#00ff41] text-black font-black p-5 rounded-2xl uppercase text-xs tracking-[0.2em]">Unlock Core</button>
                </div>

                <div id="admin-panel" class="hidden space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="hacker-card p-8 rounded-[32px]">
                            <h3 class="text-white text-[10px] font-black mb-8 uppercase tracking-[0.3em] flex items-center gap-2">
                                <span class="w-2 h-2 bg-[#00ff41] rounded-full"></span> Subir Inventario
                            </h3>
                            <div class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="in-bin" placeholder="BIN" class="p-5 rounded-2xl text-sm">
                                    <input type="text" id="in-price" placeholder="Precio ($)" class="p-5 rounded-2xl text-sm">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="in-country" placeholder="País (Bandera)" class="p-5 rounded-2xl text-sm">
                                    <input type="text" id="in-city" placeholder="Ciudad" class="p-5 rounded-2xl text-sm">
                                </div>
                                <input type="text" id="in-date" placeholder="EXP (MM/YY)" class="p-5 rounded-2xl text-sm">
                                <button onclick="addStockToCloud()" class="btn-buy w-full p-5 rounded-2xl font-black uppercase text-xs tracking-widest mt-4">Publicar en el Mercado</button>
                            </div>
                        </div>

                        <div class="hacker-card p-8 rounded-[32px] flex flex-col justify-between">
                            <div>
                                <h3 class="text-white text-[10px] font-black mb-8 uppercase tracking-[0.3em] flex items-center gap-2">
                                    <span class="w-2 h-2 bg-blue-500 rounded-full"></span> Configuración
                                </h3>
                                <div class="space-y-6">
                                    <div>
                                        <label class="text-[9px] opacity-30 uppercase ml-2 mb-2 block">WhatsApp Enlace</label>
                                        <div class="flex gap-2">
                                            <input type="text" id="config-phone" placeholder="505..." class="flex-1 p-5 rounded-2xl text-sm">
                                            <button onclick="savePhone()" class="bg-white text-black px-6 rounded-2xl font-black text-[10px] hover:bg-zinc-200 transition-colors">SAVE</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="admin-inventory-list" class="mt-8 space-y-3 overflow-y-auto max-h-48 pr-2"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- NAVIGATION -->
        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-black/80 backdrop-blur-3xl border border-white/5 rounded-[32px] flex justify-around p-3 z-[100] shadow-2xl">
            <button onclick="changeView('store')" id="nav-store" class="nav-link active flex flex-col items-center gap-1.5 p-3 rounded-2xl transition-all">
                <span class="text-2xl">💳</span>
                <span class="text-[7px] font-black uppercase tracking-widest">Inventario</span>
            </button>
            <button onclick="changeView('admin')" id="nav-admin" class="nav-link opacity-30 flex flex-col items-center gap-1.5 p-3 rounded-2xl transition-all">
                <span class="text-2xl">🛰️</span>
                <span class="text-[7px] font-black uppercase tracking-widest">Admin</span>
            </button>
            <button onclick="handleLogout()" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl opacity-30 text-[#ff3131]">
                <span class="text-2xl">☣️</span>
                <span class="text-[7px] font-black uppercase tracking-widest">Logout</span>
            </button>
        </nav>
    </div>

    <!-- MODAL ORDER -->
    <div id="modal-order" class="fixed inset-0 bg-black/95 z-[6000] hidden items-center justify-center p-6 backdrop-blur-xl">
        <div class="hacker-card w-full max-w-sm p-10 rounded-[48px] border-t-2 border-t-[#00ff41] relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-[#00ff41]/5 rounded-full blur-3xl"></div>
            
            <h2 class="text-white font-black text-2xl mb-8 premium-font tracking-tighter">ORDEN SEGURA</h2>
            
            <div id="modal-content-info" class="space-y-4 mb-10"></div>
            
            <div class="space-y-6">
                <div>
                    <label class="text-[9px] opacity-40 mb-3 block uppercase tracking-widest ml-1 font-bold">Ubicación del Comprador:</label>
                    <input type="text" id="order-city-input" placeholder="Ciudad / País Destino" class="w-full p-5 rounded-2xl text-sm border-none ring-1 ring-white/10">
                </div>
                
                <div class="flex gap-4 pt-4">
                    <button onclick="closeModal()" class="flex-1 bg-zinc-900 text-zinc-500 p-5 rounded-2xl font-black text-[10px] uppercase transition-all">CANCELAR</button>
                    <button onclick="sendToWhatsApp()" class="btn-buy flex-[2] p-5 rounded-2xl font-black text-[10px] uppercase transition-all shadow-xl shadow-[#00ff41]/20">SOLICITAR VIA WA</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE (Mantener la misma que el usuario proporcionó)
        const firebaseConfig = {
            apiKey: "AIzaSyC17dzIZSZtMbzu5V7dIHWdm6nDmoBN-KY",
            authDomain: "shadow-music-f033d.firebaseapp.com",
            projectId: "shadow-music-f033d",
            storageBucket: "shadow-music-f033d.firebasestorage.app",
            messagingSenderId: "358954790180",
            appId: "1:358954790180:web:ef7abfb3fc45b291d657b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_UID = "shadow-cc-v3";

        let authMode = 'login', user = null, stock = [], config = { phone: "50582269592", pass: "admin123" }, currentOrder = null;

        // ANIMACIÓN DE FONDO (Matrix lite)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        const dots = Array(100).fill().map(() => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5
        }));

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            dots.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if(d.x < 0 || d.x > canvas.width) d.vx *= -1;
                if(d.y < 0 || d.y > canvas.height) d.vy *= -1;
                ctx.beginPath();
                ctx.arc(d.x, d.y, 1, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // NOTIFICACIONES
        window.notify = (msg, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-5 rounded-2xl text-[10px] font-black border-l-4 ${isError ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-[#00ff41]/10 border-[#00ff41] text-[#00ff41]'} backdrop-blur-xl shadow-2xl transition-all scale-0`;
            toast.innerText = msg.toUpperCase();
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('scale-0'), 100);
            setTimeout(() => { toast.classList.add('scale-0'); setTimeout(() => toast.remove(), 400); }, 4000);
        };

        // AUTH LOGIC
        window.setAuth = (mode) => {
            authMode = mode;
            document.getElementById('t-login').className = `flex-1 py-3 text-[10px] font-black rounded-xl transition-all ${mode === 'login' ? 'border-b-2 border-[#00ff41] bg-white/5' : 'opacity-30'}`;
            document.getElementById('t-signup').className = `flex-1 py-3 text-[10px] font-black rounded-xl transition-all ${mode === 'signup' ? 'border-b-2 border-[#00ff41] bg-white/5' : 'opacity-30'}`;
        };

        window.handleAuthAction = async () => {
            const email = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!email || !p) return notify("CAMPOS VACÍOS", true);
            try { 
                authMode === 'login' ? await signInWithEmailAndPassword(auth, email, p) : await createUserWithEmailAndPassword(auth, email, p); 
                notify("SISTEMA AUTORIZADO");
            } catch(err) { notify(err.message, true); }
        };

        window.loginGoogle = async () => {
            try { await signInWithPopup(auth, new GoogleAuthProvider()); }
            catch(err) { notify("ERROR AUTH GOOGLE", true); }
        };

        window.handleLogout = () => signOut(auth);

        // ESTADO USUARIO
        onAuthStateChanged(auth, (u) => {
            user = u;
            document.getElementById('loading').classList.add('opacity-0');
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            if(u) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                document.getElementById('user-tag').innerText = `NODE: ${u.email.split('@')[0]}`;
                syncCloud();
            } else {
                document.getElementById('view-app').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        });

        function syncCloud() {
            onSnapshot(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), (s) => {
                if(s.exists()) {
                    config = s.data();
                    document.getElementById('config-phone').value = config.phone;
                } else {
                    setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), config);
                }
            });

            onSnapshot(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), (s) => {
                stock = s.docs.map(d => ({id: d.id, ...d.data()}));
                renderStoreGrid(stock);
                renderAdminView();
            });
        }

        // NAVEGACIÓN
        window.changeView = (v) => {
            document.querySelectorAll('.subview').forEach(x => x.classList.add('hidden'));
            document.getElementById('sec-'+v).classList.remove('hidden');
            document.getElementById('nav-store').classList.toggle('opacity-30', v !== 'store');
            document.getElementById('nav-store').classList.toggle('active', v === 'store');
            document.getElementById('nav-admin').classList.toggle('opacity-30', v !== 'admin');
            document.getElementById('nav-admin').classList.toggle('active', v === 'admin');
        };

        // RENDER CARDS CON INTERACCIÓN 3D
        function renderStoreGrid(data) {
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = data.length ? '' : '<div class="col-span-full py-20 text-center opacity-10 text-xs tracking-[1em] premium-font">NO_STOCK_FOUND</div>';
            
            data.forEach((item, index) => {
                const cardId = `cc-${item.id}`;
                grid.innerHTML += `
                    <div class="hacker-card p-6 rounded-[40px] space-y-6 card-container">
                        <div id="${cardId}" class="cc-visual p-8 flex flex-col justify-between" onmousemove="handleCardMove(event, '${cardId}')" onmouseleave="resetCard('${cardId}')">
                            <div class="flex justify-between items-start">
                                <div class="cc-chip"></div>
                                <div class="text-[9px] text-white/40 premium-font italic uppercase tracking-tighter">Gold Premium</div>
                            </div>
                            
                            <div class="mt-4">
                                <div class="text-[8px] uppercase tracking-[0.4em] text-white/30 mb-2 font-bold">Secure Digital Link</div>
                                <div class="text-xl md:text-2xl text-white font-mono tracking-[0.25em] drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">
                                    ${item.bin.slice(0,4)} ${item.bin.slice(4,8)} **** ****
                                </div>
                            </div>

                            <div class="flex justify-between items-end border-t border-white/5 pt-4">
                                <div class="flex-1 overflow-hidden pr-4">
                                    <div class="text-[7px] uppercase text-white/30 tracking-widest font-bold mb-1">Region Control</div>
                                    <div class="text-[11px] text-[#00ff41] truncate font-black uppercase tracking-tight">${item.city} - ${item.country}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[7px] uppercase text-white/30 tracking-widest font-bold mb-1">Expiry</div>
                                    <div class="text-[12px] text-white font-mono font-bold">${item.expDate}</div>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between gap-6 px-2">
                            <div>
                                <span class="text-[8px] block opacity-40 uppercase tracking-widest font-black">Net Price</span>
                                <span class="text-2xl font-black text-white premium-font">$${item.price}</span>
                            </div>
                            <button onclick="openCheckout('${item.id}')" class="btn-buy flex-1 text-[10px] font-black py-4 rounded-2xl uppercase tracking-widest shadow-xl shadow-[#00ff41]/10">
                                Adquirir Ahora
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // CONTROLADORES DE MOVIMIENTO 3D
        window.handleCardMove = (e, id) => {
            const card = document.getElementById(id);
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 8;
            const rotateY = (centerX - x) / 8;
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            card.style.animation = 'none'; // Pausar flote mientras se toca
            card.style.boxShadow = `${-rotateY * 2}px ${rotateX * 2}px 60px rgba(0, 255, 65, 0.3)`;
        };

        window.resetCard = (id) => {
            const card = document.getElementById(id);
            card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            card.style.animation = 'float 6s ease-in-out infinite';
            card.style.boxShadow = `0 20px 50px rgba(0, 0, 0, 0.8)`;
        };

        // ADMIN LOGIC
        window.unlockAdmin = () => {
            if(document.getElementById('admin-key').value === config.pass) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                notify("SISTEMAS DESBLOQUEADOS - ROOT ACTIVE");
            } else { notify("ACCESO DENEGADO", true); }
        };

        window.addStockToCloud = async () => {
            const bin = document.getElementById('in-bin').value;
            const country = document.getElementById('in-country').value;
            const city = document.getElementById('in-city').value;
            const expDate = document.getElementById('in-date').value;
            const price = document.getElementById('in-price').value;

            if(!bin || !price || !city) return notify("DATOS INCOMPLETOS", true);

            try {
                await addDoc(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), {
                    bin, country, city, expDate, price, timestamp: Date.now()
                });
                notify("ITEM PUBLICADO EXITOSAMENTE");
                ['in-bin', 'in-price', 'in-city', 'in-date'].forEach(id => document.getElementById(id).value = '');
            } catch (e) { notify("ERROR DE ESCRITURA", true); }
        };

        window.deleteCC = async (id) => {
            if(confirm("¿Eliminar este registro permanentemente?")) {
                await deleteDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'stock', id));
                notify("ITEM REMOVIDO");
            }
        };

        function renderAdminView() {
            const list = document.getElementById('admin-inventory-list');
            list.innerHTML = '';
            stock.forEach(item => {
                list.innerHTML += `
                    <div class="bg-black/40 p-4 rounded-xl flex justify-between items-center text-[10px] border border-white/5">
                        <span class="text-white/60 font-bold">${item.bin} <span class="text-[#00ff41] mx-1">|</span> ${item.city}</span>
                        <button onclick="deleteCC('${item.id}')" class="text-[#ff3131] px-2 font-black">BORRAR</button>
                    </div>
                `;
            });
        }

        window.savePhone = async () => {
            const phone = document.getElementById('config-phone').value.replace(/\D/g, '');
            await setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), { ...config, phone });
            notify("TERMINAL WA GUARDADO");
        };

        // CHECKOUT & WHATSAPP
        window.openCheckout = (id) => {
            currentOrder = stock.find(i => i.id === id);
            document.getElementById('modal-content-info').innerHTML = `
                <div class="bg-zinc-950 p-8 rounded-[32px] border border-[#00ff41]/20 space-y-5">
                    <div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <span class="text-[9px] opacity-40 uppercase font-bold">Bin Id</span>
                        <span class="text-[#00ff41] font-mono font-black tracking-widest">${currentOrder.bin}</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <span class="text-[9px] opacity-40 uppercase font-bold">Region</span>
                        <span class="text-white text-[10px] font-black">${currentOrder.city}, ${currentOrder.country}</span>
                    </div>
                    <div class="flex justify-between items-center pt-3">
                        <span class="text-[10px] font-black text-zinc-500 uppercase">Total Access</span>
                        <span class="text-2xl font-black text-[#ff3131]">$${currentOrder.price}</span>
                    </div>
                </div>
            `;
            document.getElementById('modal-order').classList.remove('hidden');
            document.getElementById('modal-order').classList.add('flex');
        };

        window.closeModal = () => {
            document.getElementById('modal-order').classList.add('hidden');
            document.getElementById('modal-order').classList.remove('flex');
        };

        window.sendToWhatsApp = () => {
            const clientCity = document.getElementById('order-city-input').value;
            if(!clientCity) return notify("INGRESE DESTINO DE ENVÍO", true);

            const msg = `⚡ *NUEVA ORDEN - SHADOW PREMIUM* ⚡
━━━━━━━━━━━━━━━━━━━━━
╭━━ *𝓓𝓮𝓽𝓪𝓵𝓵𝓮𝓼 𝓭𝓮 𝓵𝓪 𝓒𝓒* ━━╮
┃
┃ 📟 *BIN:* ${currentOrder.bin}
┃ 🏙️ *CIUDAD:* ${currentOrder.city}
┃ 🌍 *PAÍS:* ${currentOrder.country}
┃ 💰 *PRECIO:* $${currentOrder.price}
┃
╰━━━━━━━━━━━━━━━━━━━━╯

╭━━ *𝓒𝓵𝓲𝓮𝓷𝓽𝓮* ━━╮
┃
┃ 👤 *NODE:* ${user.email}
┃ 🏙️ *ENVÍO:* ${clientCity}
┃
╰━━━━━━━━━━━━━━━━━━━━╯
━━━━━━━━━━━━━━━━━━━━━
*ESTADO: PENDIENTE DE VALIDACIÓN*`;

            window.open(`https://api.whatsapp.com/send?phone=${config.phone}&text=${encodeURIComponent(msg)}`, '_blank');
            closeModal();
        };

        window.filterStock = (val) => {
            const term = val.toLowerCase();
            const filtered = stock.filter(i => 
                i.bin.includes(term) || 
                i.country.toLowerCase().includes(term) || 
                i.city.toLowerCase().includes(term)
            );
            renderStoreGrid(filtered);
        };

    </script>
</body>
</html>
