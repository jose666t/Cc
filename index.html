<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW CC </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --neon: #00ff41;
            --bg: #050505;
            --accent: #ff3131;
            --card-grad: linear-gradient(145deg, #111827 0%, #000000 100%);
            --glow: rgba(0, 255, 65, 0.2);
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .premium-font { font-family: 'Orbitron', sans-serif; }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        .title-3d {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #fff;
            text-shadow: 
                0 1px 0 #ccc, 
                0 3px 0 #bbb, 
                0 6px 1px rgba(0,0,0,.1), 
                0 0 20px var(--neon);
        }

        .card-container { perspective: 1200px; }

        .cc-visual {
            aspect-ratio: 1.58 / 1;
            background: var(--card-grad);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); }
            50% { transform: translateY(-15px) rotateX(2deg) rotateY(-1deg); }
        }

        .cc-visual::before {
            content: '';
            position: absolute;
            top: -150%; left: -150%;
            width: 300%; height: 300%;
            background: linear-gradient(45deg, transparent 45%, rgba(255, 255, 255, 0.1) 50%, transparent 55%);
            animation: shine 8s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(-20deg); }
            20%, 100% { transform: translateX(100%) rotate(-20deg); }
        }

        .cc-chip {
            width: 45px; height: 35px;
            background: linear-gradient(135deg, #f3d060 0%, #d4af37 50%, #8a6d1c 100%);
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .hacker-card {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 65, 0.1);
        }

        input {
            background: rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            color: var(--neon) !important;
            outline: none;
        }

        .nav-link.active {
            color: #fff;
            text-shadow: 0 0 15px var(--neon);
            transform: translateY(-3px);
            opacity: 1;
        }

        .btn-buy {
            background: var(--neon);
            color: #000;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="pb-24">

    <canvas id="bg-canvas"></canvas>
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[10000] w-full max-w-xs space-y-2 px-4"></div>

    <!-- CARGA -->
    <div id="loading" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="relative w-20 h-20 mb-8">
            <div class="absolute inset-0 border-4 border-zinc-900 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-t-[#00ff41] rounded-full animate-spin"></div>
        </div>
        <div class="premium-font text-xs tracking-[0.5em] uppercase animate-pulse text-white font-bold text-center">Iniciando Terminal Shadow...</div>
    </div>

    <!-- AUTH VIEW -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="hacker-card w-full max-w-md p-10 rounded-[40px] border-t-4 border-t-[#00ff41]">
            <div class="text-center mb-10">
                <div class="text-6xl mb-6 drop-shadow-[0_0_15px_rgba(0,255,65,0.5)]">💳</div>
                <h1 class="premium-font text-4xl title-3d mb-2">SHADOW <span class="text-[#00ff41]">CC</span></h1>
                <p class="text-[9px] opacity-40 uppercase tracking-[0.5em]">Mercado Premium Auto-Bank v4.1</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Usuario / Email" class="w-full p-5 rounded-2xl text-sm">
                <input type="password" id="pass" placeholder="Contraseña de Seguridad" class="w-full p-5 rounded-2xl text-sm">
                <button onclick="handleAuthAction()" class="btn-buy w-full p-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-[#00ff41]/20">Acceder al Mercado</button>
                <div class="flex items-center gap-3 py-2">
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                    <span class="text-[9px] opacity-30 font-bold">O</span>
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                </div>
                <button onclick="loginGoogle()" class="w-full bg-white text-black font-black p-5 rounded-2xl flex items-center justify-center gap-3 text-xs">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> Login con Google
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="view-app" class="hidden">
        <header class="p-6 border-b border-white/5 sticky top-0 bg-black/60 backdrop-blur-2xl z-50 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="text-2xl">💳</div>
                <div>
                    <h1 class="premium-font text-lg font-black text-white tracking-tighter">SHADOW <span class="text-[#00ff41]">CC</span></h1>
                    <div id="user-tag" class="text-[8px] opacity-40 font-bold uppercase tracking-widest"></div>
                </div>
            </div>
            <div class="bg-zinc-900/80 px-4 py-2 rounded-full border border-white/5 flex items-center gap-3">
                <div class="w-1.5 h-1.5 rounded-full bg-[#00ff41] animate-pulse"></div>
                <span class="text-[9px] text-zinc-400 font-black uppercase">Live Market</span>
            </div>
        </header>

        <main class="p-6 max-w-6xl mx-auto">
            <!-- STORE -->
            <section id="sec-store" class="subview space-y-8">
                <input type="text" id="search" onkeyup="filterStock(this.value)" placeholder="Filtrar por BIN, Banco o Ciudad..." class="w-full p-5 rounded-3xl border-none ring-1 ring-white/5 focus:ring-[#00ff41]/40 text-sm">
                <div id="marketplace-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </section>

            <!-- ADMIN -->
            <section id="sec-admin" class="subview hidden">
                <div id="admin-login" class="hacker-card p-12 rounded-[40px] text-center max-w-md mx-auto">
                    <div class="text-4xl mb-6">🔐</div>
                    <h2 class="premium-font text-xl mb-6 text-white font-bold">ACCESO ROOT</h2>
                    <input type="password" id="admin-key" placeholder="••••••••" class="w-full p-5 rounded-2xl text-center mb-6 tracking-[10px] text-xl">
                    <button onclick="unlockAdmin()" class="w-full bg-[#00ff41] text-black font-black p-5 rounded-2xl uppercase text-xs tracking-[0.2em]">Desbloquear</button>
                </div>

                <div id="admin-panel" class="hidden space-y-8">
                    <div class="hacker-card p-8 rounded-[32px]">
                        <h3 class="text-white text-[10px] font-black mb-8 uppercase tracking-[0.3em]">Gestión de Inventario</h3>
                        <div class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[8px] opacity-40 ml-2 mb-1 block">BIN (Detección Automática)</label>
                                    <input type="text" id="in-bin" maxlength="8" oninput="handleBinInput(this.value)" placeholder="Ej: 455612" class="w-full p-5 rounded-2xl text-sm">
                                </div>
                                <div>
                                    <label class="text-[8px] opacity-40 ml-2 mb-1 block">Banco Confirmado</label>
                                    <input type="text" id="in-bank" readonly placeholder="Esperando BIN..." class="w-full p-5 rounded-2xl text-sm opacity-60">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="in-country" placeholder="País (Bandera)" class="p-5 rounded-2xl text-sm">
                                <input type="text" id="in-city" placeholder="Ciudad" class="p-5 rounded-2xl text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="in-date" placeholder="EXP (MM/YY)" class="p-5 rounded-2xl text-sm">
                                <input type="text" id="in-price" placeholder="Precio ($)" class="p-5 rounded-2xl text-sm">
                            </div>
                            <button onclick="addStockToCloud()" class="btn-buy w-full p-5 rounded-2xl font-black uppercase text-xs tracking-widest mt-4">Publicar Producto</button>
                        </div>
                    </div>
                    <div id="admin-inventory-list" class="space-y-3"></div>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-black/80 backdrop-blur-3xl border border-white/5 rounded-[32px] flex justify-around p-3 z-[100] shadow-2xl">
            <button onclick="changeView('store')" id="nav-store" class="nav-link active flex flex-col items-center gap-1.5 p-3 rounded-2xl transition-all">
                <span class="text-2xl">💳</span>
                <span class="text-[7px] font-black uppercase tracking-widest">Tienda</span>
            </button>
            <button onclick="changeView('admin')" id="nav-admin" class="nav-link opacity-30 flex flex-col items-center gap-1.5 p-3 rounded-2xl transition-all">
                <span class="text-2xl">🛠️</span>
                <span class="text-[7px] font-black uppercase tracking-widest">Admin</span>
            </button>
            <button onclick="handleLogout()" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl opacity-30 text-[#ff3131]">
                <span class="text-2xl">🔌</span>
                <span class="text-[7px] font-black uppercase tracking-widest">Salir</span>
            </button>
        </nav>
    </div>

    <!-- MODAL -->
    <div id="modal-order" class="fixed inset-0 bg-black/95 z-[6000] hidden items-center justify-center p-6 backdrop-blur-xl">
        <div class="hacker-card w-full max-w-sm p-10 rounded-[48px] border-t-2 border-t-[#00ff41]">
            <h2 class="text-white font-black text-2xl mb-8 premium-font tracking-tighter">FINALIZAR COMPRA</h2>
            <div id="modal-content-info" class="space-y-4 mb-10"></div>
            <div class="space-y-6">
                <input type="text" id="order-city-input" placeholder="Ciudad de Destino" class="w-full p-5 rounded-2xl text-sm">
                <div class="flex gap-4">
                    <button onclick="closeModal()" class="flex-1 bg-zinc-900 text-zinc-500 p-5 rounded-2xl font-black text-[10px]">ATRÁS</button>
                    <button onclick="sendToWhatsApp()" class="btn-buy flex-[2] p-5 rounded-2xl font-black text-[10px] shadow-xl shadow-[#00ff41]/20">WHATSAPP</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC17dzIZSZtMbzu5V7dIHWdm6nDmoBN-KY",
            authDomain: "shadow-music-f033d.firebaseapp.com",
            projectId: "shadow-music-f033d",
            storageBucket: "shadow-music-f033d.firebasestorage.app",
            messagingSenderId: "358954790180",
            appId: "1:358954790180:web:ef7abfb3fc45b291d657b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_UID = "shadow-cc-v4-bank";

        let user = null, stock = [], config = { phone: "50582269592", pass: "admin123" }, currentOrder = null;

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        function animateBg() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            for(let i=0; i<30; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 0.5, 0, Math.PI*2);
                ctx.fill();
            }
            setTimeout(() => requestAnimationFrame(animateBg), 150);
        }
        animateBg();

        window.notify = (msg, isErr=false) => {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `p-4 rounded-xl text-[10px] font-black border-l-4 ${isErr ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-[#00ff41]/10 border-[#00ff41] text-[#00ff41]'} backdrop-blur-xl`;
            t.innerText = msg.toUpperCase();
            container.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        };

        let typingTimer;
        window.handleBinInput = (val) => {
            clearTimeout(typingTimer);
            if(val.length >= 6) {
                typingTimer = setTimeout(() => fetchBankInfo(val), 500);
            }
        };

        async function fetchBankInfo(bin) {
            const bankInput = document.getElementById('in-bank');
            bankInput.value = "Consultando...";
            try {
                const res = await fetch(`https://data.handyapi.com/bin/${bin.slice(0,6)}`);
                const data = await res.json();
                if(data && data.Status === "SUCCESS") {
                    bankInput.value = `${data.Bank || 'GENERIC'} (${data.Scheme || 'N/A'})`.toUpperCase();
                    notify("Banco Detectado");
                } else {
                    bankInput.value = "No Identificado";
                }
            } catch (e) { bankInput.value = "Error de Red"; }
        }

        onAuthStateChanged(auth, u => {
            user = u;
            document.getElementById('loading').style.display = 'none';
            if(u) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                document.getElementById('user-tag').innerText = u.email.split('@')[0];
                sync();
            } else {
                document.getElementById('view-app').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        });

        window.handleAuthAction = async () => {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); } catch {
                try { await createUserWithEmailAndPassword(auth, e, p); } catch(err) { notify(err.message, true); }
            }
        };

        window.loginGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.handleLogout = () => signOut(auth);

        function sync() {
            onSnapshot(doc(db, 'artifacts', APP_UID, 'public', 'data', 'config', 'main'), s => {
                if(s.exists()) config = s.data();
                else setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'config', 'main'), config);
            });
            onSnapshot(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), s => {
                stock = s.docs.map(d => ({id: d.id, ...d.data()}));
                renderStore();
                renderAdmin();
            });
        }

        window.changeView = v => {
            document.querySelectorAll('.subview').forEach(x => x.classList.add('hidden'));
            document.getElementById('sec-'+v).classList.remove('hidden');
            document.querySelectorAll('.nav-link').forEach(n => n.classList.add('opacity-30'));
            document.getElementById('nav-'+v).classList.remove('opacity-30');
            document.getElementById('nav-'+v).classList.add('active');
        };

        function renderStore() {
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = stock.length ? '' : '<p class="col-span-full text-center opacity-20 py-20 font-bold tracking-[0.5em]">SIN INVENTARIO</p>';
            stock.forEach(item => {
                const id = `card-${item.id}`;
                grid.innerHTML += `
                <div class="hacker-card p-6 rounded-[40px] space-y-6 card-container">
                    <div id="${id}" class="cc-visual p-8 flex flex-col justify-between" onmousemove="move(event, '${id}')" onmouseleave="stop('${id}')">
                        <div class="flex justify-between items-start">
                            <div class="cc-chip"></div>
                            <div class="text-[8px] text-white/70 font-black uppercase text-right leading-tight drop-shadow-md">
                                ${item.bank || 'Shadow Premium'}<br>
                                <span class="text-[#00ff41] opacity-50">Nodo Verificado</span>
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="text-[7px] tracking-[0.4em] opacity-30 mb-1 font-bold">ASSET BIN</div>
                            <div class="text-xl text-white font-mono tracking-[0.2em] drop-shadow-lg">${item.bin} **** ****</div>
                        </div>
                        <div class="flex justify-between items-end border-t border-white/5 pt-4">
                            <div class="flex-1 overflow-hidden">
                                <div class="text-[7px] opacity-30 font-bold uppercase tracking-widest">${item.country}</div>
                                <div class="text-[10px] text-[#00ff41] font-black truncate">${item.city}</div>
                            </div>
                            <div class="text-right text-[11px] font-mono text-white font-bold">${item.expDate}</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-2xl font-black text-white">$${item.price}</span>
                        <button onclick="openCheckout('${item.id}')" class="btn-buy flex-1 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-[#00ff41]/20">Comprar</button>
                    </div>
                </div>`;
            });
        }

        window.move = (e, id) => {
            const el = document.getElementById(id);
            const r = el.getBoundingClientRect();
            const x = (e.clientX - r.left - r.width/2)/10;
            const y = (e.clientY - r.top - r.height/2)/10;
            el.style.transform = `rotateY(${x}deg) rotateX(${-y}deg) scale(1.05)`;
            el.style.animation = 'none';
        };

        window.stop = (id) => {
            const el = document.getElementById(id);
            el.style.transform = `rotate(0) scale(1)`;
            el.style.animation = 'float 6s ease-in-out infinite';
        };

        window.unlockAdmin = () => {
            if(document.getElementById('admin-key').value === config.pass) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                notify("Sistemas Activos");
            } else notify("Clave Incorrecta", true);
        };

        window.addStockToCloud = async () => {
            const bin = document.getElementById('in-bin').value;
            const bank = document.getElementById('in-bank').value;
            const country = document.getElementById('in-country').value;
            const city = document.getElementById('in-city').value;
            const expDate = document.getElementById('in-date').value;
            const price = document.getElementById('in-price').value;

            if(!bin || !price) return notify("Faltan Datos", true);

            await addDoc(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), {
                bin, bank, country, city, expDate, price, t: Date.now()
            });
            notify("CC Publicada");
        };

        window.deleteCC = id => deleteDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'stock', id));

        function renderAdmin() {
            const list = document.getElementById('admin-inventory-list');
            list.innerHTML = '';
            stock.forEach(i => {
                list.innerHTML += `
                    <div class="bg-black/40 p-4 rounded-xl flex justify-between items-center text-[10px] border border-white/5">
                        <span class="font-bold">${i.bin} <span class="opacity-30">|</span> ${i.bank || 'S/B'}</span>
                        <button onclick="deleteCC('${i.id}')" class="text-red-500 font-black px-2">Borrar</button>
                    </div>`;
            });
        }

        window.savePhone = () => {
            const phone = document.getElementById('config-phone').value;
            setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'config', 'main'), {...config, phone});
            notify("Guardado");
        };

        window.openCheckout = id => {
            currentOrder = stock.find(x => x.id === id);
            document.getElementById('modal-content-info').innerHTML = `
                <div class="bg-black/50 p-6 rounded-2xl border border-white/5 text-center">
                    <p class="text-[9px] opacity-40 uppercase font-black mb-1">Banco Asociado</p>
                    <p class="text-white font-black text-lg mb-4 tracking-tighter">${currentOrder.bank || 'GENERAL PREMIUM'}</p>
                    <p class="text-[9px] opacity-40 uppercase font-black mb-1">Costo de Licencia</p>
                    <p class="text-3xl font-black text-[#ff3131]">$${currentOrder.price}</p>
                </div>`;
            document.getElementById('modal-order').classList.remove('hidden');
            document.getElementById('modal-order').classList.add('flex');
        };

        window.closeModal = () => document.getElementById('modal-order').classList.add('hidden');

        window.sendToWhatsApp = () => {
            const dest = document.getElementById('order-city-input').value;
            if(!dest) return notify("Indique su ubicación", true);
            const msg = `💳 *COMPRA SHADOW CC*\n\n🏛️ *BANCO:* ${currentOrder.bank}\n📟 *BIN:* ${currentOrder.bin}\n💰 *PRECIO:* $${currentOrder.price}\n📍 *ENVÍO:* ${dest}\n👤 *ID:* ${user.email}`;
            window.open(`https://wa.me/${config.phone}?text=${encodeURIComponent(msg)}`);
        };

        window.filterStock = val => {
            const t = val.toLowerCase();
            const filtered = stock.filter(i => 
                i.bin.includes(t) || 
                (i.bank && i.bank.toLowerCase().includes(t)) ||
                i.city.toLowerCase().includes(t)
            );
            renderStoreGridManual(filtered);
        };

        function renderStoreGridManual(filteredData) {
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = filteredData.length ? '' : '<p class="col-span-full text-center opacity-20 py-20 font-bold tracking-[0.5em]">SIN RESULTADOS</p>';
            filteredData.forEach(item => {
                const id = `card-${item.id}`;
                grid.innerHTML += `
                <div class="hacker-card p-6 rounded-[40px] space-y-6 card-container">
                    <div id="${id}" class="cc-visual p-8 flex flex-col justify-between" onmousemove="move(event, '${id}')" onmouseleave="stop('${id}')">
                        <div class="flex justify-between items-start">
                            <div class="cc-chip"></div>
                            <div class="text-[8px] text-white/70 font-black uppercase text-right leading-tight drop-shadow-md">
                                ${item.bank || 'Shadow Premium'}<br>
                                <span class="text-[#00ff41] opacity-50">Nodo Verificado</span>
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="text-[7px] tracking-[0.4em] opacity-30 mb-1 font-bold">ASSET BIN</div>
                            <div class="text-xl text-white font-mono tracking-[0.2em] drop-shadow-lg">${item.bin} **** ****</div>
                        </div>
                        <div class="flex justify-between items-end border-t border-white/5 pt-4">
                            <div class="flex-1 overflow-hidden">
                                <div class="text-[7px] opacity-30 font-bold uppercase tracking-widest">${item.country}</div>
                                <div class="text-[10px] text-[#00ff41] font-black truncate">${item.city}</div>
                            </div>
                            <div class="text-right text-[11px] font-mono text-white font-bold">${item.expDate}</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-2xl font-black text-white">$${item.price}</span>
                        <button onclick="openCheckout('${item.id}')" class="btn-buy flex-1 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-[#00ff41]/20">Comprar</button>
                    </div>
                </div>`;
            });
        }
    </script>
</body>
</html>
