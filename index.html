<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW CC - OFFICIAL MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        .terminal-font { font-family: 'VT323', monospace; }

        .glass-panel {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .input-dark {
            background: #000 !important;
            border: 1px solid #333 !important;
            color: var(--neon-green) !important;
        }

        .input-dark:focus {
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: fixed;
            top: 0;
            z-index: 9999;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .nav-active {
            color: white;
            text-shadow: 0 0 10px var(--neon-green);
            border-top: 2px solid var(--neon-green);
        }
    </style>
</head>
<body class="pb-24">

    <div class="scanline"></div>

    <!-- NOTIFICACIONES PERSONALIZADAS -->
    <div id="notification-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[10000] w-full max-w-xs space-y-2"></div>

    <!-- PANTALLA DE CARGA -->
    <div id="loader" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-zinc-800 border-t-[#00ff41] rounded-full animate-spin mb-4"></div>
        <div class="terminal-font text-xl tracking-widest uppercase">Shadow System Initializing...</div>
    </div>

    <!-- VISTA AUTENTICACIÓN -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl">
            <div class="text-center mb-8">
                <div class="text-5xl mb-2">💀</div>
                <h1 class="terminal-font text-4xl tracking-tighter">SHADOW CC</h1>
                <p class="text-xs opacity-50 uppercase tracking-widest">Restricted Access</p>
            </div>

            <div class="flex mb-6 border-b border-zinc-800">
                <button onclick="setAuthMode('login')" id="tab-login" class="flex-1 pb-2 text-sm font-bold border-b-2 border-[#00ff41]">LOGIN</button>
                <button onclick="setAuthMode('signup')" id="tab-signup" class="flex-1 pb-2 text-sm font-bold border-b-2 border-transparent opacity-40">SIGNUP</button>
            </div>

            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" class="input-dark w-full p-4 rounded-lg outline-none">
                <input type="password" id="auth-pass" placeholder="Password" class="input-dark w-full p-4 rounded-lg outline-none">
                <button onclick="handleAuth()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-lg active:scale-95 transition-transform uppercase">Entrar al Sistema</button>
                
                <div class="relative py-2 flex items-center">
                    <div class="flex-grow border-t border-zinc-800"></div>
                    <span class="px-3 text-xs opacity-40">O CONTINUAR CON</span>
                    <div class="flex-grow border-t border-zinc-800"></div>
                </div>

                <button onclick="handleGoogleAuth()" class="w-full bg-white text-black font-bold p-4 rounded-lg flex items-center justify-center gap-3 active:scale-95 transition-transform">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> Google
                </button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="view-app" class="hidden">
        <header class="p-6 border-b border-zinc-900 bg-black/50 sticky top-0 z-50 backdrop-blur">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="terminal-font text-2xl tracking-widest">SHADOW CC</h1>
                    <div id="user-display" class="text-[10px] opacity-40 truncate max-w-[150px]"></div>
                </div>
                <div class="text-[#ff3131] text-2xl animate-pulse">💀</div>
            </div>
        </header>

        <main class="p-4">
            <!-- VISTA TIENDA -->
            <section id="sub-store" class="sub-view">
                <input type="text" onkeyup="filterStore(this.value)" placeholder="Buscar por BIN o País..." class="input-dark w-full p-4 rounded-xl mb-6 outline-none">
                <div id="store-grid" class="grid grid-cols-1 gap-4">
                    <!-- Cards via JS -->
                </div>
            </section>

            <!-- VISTA ADMIN -->
            <section id="sub-admin" class="sub-view hidden">
                <div id="admin-gate" class="glass-panel p-8 rounded-2xl text-center">
                    <h2 class="terminal-font text-2xl mb-4">COMANDO CENTRAL</h2>
                    <input type="password" id="admin-key" placeholder="Llave Maestra" class="input-dark w-full p-4 rounded-lg text-center mb-4 tracking-[10px]">
                    <button onclick="unlockAdmin()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-lg">DESBLOQUEAR</button>
                </div>

                <div id="admin-panel" class="hidden space-y-6">
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="text-white font-bold mb-4 uppercase text-sm border-b border-zinc-800 pb-2">Añadir Nueva CC</h3>
                        <div class="space-y-3">
                            <input type="text" id="in-bin" placeholder="BIN (4003 4499)" class="input-dark w-full p-3 rounded-lg">
                            <input type="text" id="in-country" placeholder="País (USA 🇺🇸)" class="input-dark w-full p-3 rounded-lg">
                            <input type="text" id="in-price" placeholder="Precio ($)" class="input-dark w-full p-3 rounded-lg">
                            <button onclick="addCardToFirebase()" id="btn-add-stock" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-lg">SUBIR A LA NUBE</button>
                        </div>
                    </div>

                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="text-white font-bold mb-2 uppercase text-sm">Configuración WA</h3>
                        <input type="text" id="set-phone" class="input-dark w-full p-3 rounded-lg mb-3">
                        <button onclick="updateSettings()" class="w-full bg-zinc-800 text-white font-bold p-3 rounded-lg">GUARDAR TELÉFONO</button>
                    </div>

                    <div id="admin-list" class="space-y-2">
                        <!-- List via JS -->
                    </div>
                </div>
            </section>
        </main>

        <!-- NAVEGACIÓN INFERIOR -->
        <nav class="fixed bottom-0 left-0 w-full bg-black border-t border-zinc-900 flex justify-around p-4 z-50">
            <button onclick="showSub('store')" id="nav-store" class="nav-active flex flex-col items-center gap-1 transition-all">
                <span class="text-xl">🛒</span>
                <span class="text-[10px] font-bold">MARKET</span>
            </button>
            <button onclick="showSub('admin')" id="nav-admin" class="flex flex-col items-center gap-1 opacity-40 transition-all">
                <span class="text-xl">🛡️</span>
                <span class="text-[10px] font-bold">ADMIN</span>
            </button>
            <button onclick="logout()" class="flex flex-col items-center gap-1 opacity-40 text-red-500">
                <span class="text-xl">🚪</span>
                <span class="text-[10px] font-bold">SALIR</span>
            </button>
        </nav>
    </div>

    <!-- MODAL DE ORDEN -->
    <div id="modal-order" class="fixed inset-0 bg-black/95 z-[6000] hidden items-center justify-center p-6">
        <div class="glass-panel w-full max-w-sm p-8 rounded-2xl">
            <h2 class="text-white font-bold text-xl mb-4 border-b border-zinc-800 pb-2">NUEVA ORDEN</h2>
            <div id="order-info" class="bg-zinc-900/50 p-4 rounded-lg mb-6 text-sm space-y-1"></div>
            
            <label class="text-[10px] opacity-40 mb-1 block">CIUDAD DE RESIDENCIA:</label>
            <input type="text" id="order-city" placeholder="Ej: Managua" class="input-dark w-full p-4 rounded-lg mb-6">
            
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-zinc-900 text-white p-4 rounded-lg font-bold">X</button>
                <button onclick="submitToWA()" class="flex-[2] bg-[#00ff41] text-black p-4 rounded-lg font-bold uppercase">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyC17dzIZSZtMbzu5V7dIHWdm6nDmoBN-KY",
            authDomain: "shadow-music-f033d.firebaseapp.com",
            projectId: "shadow-music-f033d",
            storageBucket: "shadow-music-f033d.firebasestorage.app",
            messagingSenderId: "358954790180",
            appId: "1:358954790180:web:ef7abfb3fc45b291d657b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = "shadow-cc-official";

        let currentMode = 'login';
        let currentUser = null;
        let stockData = [];
        let systemConfig = { phone: "50582269592", pass: "admin123" };
        let activeCC = null;

        // --- NOTIFICACIONES ---
        window.notify = (msg, type = 'info') => {
            const container = document.getElementById('notification-container');
            const el = document.createElement('div');
            el.className = `p-4 rounded-lg text-xs font-bold border ${type === 'error' ? 'bg-red-900/80 border-red-500 text-white' : 'bg-black/90 border-[#00ff41] text-[#00ff41]'} animate-bounce`;
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        };

        // --- AUTH LOGIC ---
        window.setAuthMode = (mode) => {
            currentMode = mode;
            document.getElementById('tab-login').className = mode === 'login' ? 'flex-1 pb-2 text-sm font-bold border-b-2 border-[#00ff41]' : 'flex-1 pb-2 text-sm font-bold border-b-2 border-transparent opacity-40';
            document.getElementById('tab-signup').className = mode === 'signup' ? 'flex-1 pb-2 text-sm font-bold border-b-2 border-[#00ff41]' : 'flex-1 pb-2 text-sm font-bold border-b-2 border-transparent opacity-40';
        };

        window.handleAuth = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return notify("Completa los datos", "error");
            
            try {
                if(currentMode === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { notify(e.message, "error"); }
        };

        window.handleGoogleAuth = async () => {
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch (e) { notify("Error Google: Verifique dominios autorizados en Firebase", "error"); }
        };

        window.logout = () => signOut(auth);

        // --- OBSERVAR ESTADO ---
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('loader').style.display = 'none';
            if(user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                document.getElementById('user-display').innerText = `USER: ${user.email}`;
                syncData();
            } else {
                document.getElementById('view-app').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        });

        // --- SYNC DATA ---
        function syncData() {
            // Regla de Oro: Path según especificación
            const configRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config');
            const stockCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'stock');

            onSnapshot(configRef, (s) => {
                if(s.exists()) {
                    systemConfig = s.data();
                    document.getElementById('set-phone').value = systemConfig.phone;
                } else {
                    setDoc(configRef, systemConfig);
                }
            });

            onSnapshot(stockCol, (s) => {
                stockData = s.docs.map(d => ({id: d.id, ...d.data()}));
                renderStore();
                renderAdminList();
            }, (e) => {
                notify("Error Firestore: Verifique Reglas de Seguridad", "error");
                console.error(e);
            });
        }

        // --- TIENDA ---
        window.showSub = (view) => {
            document.querySelectorAll('.sub-view').forEach(v => v.classList.add('hidden'));
            document.getElementById('sub-' + view).classList.remove('hidden');
            document.getElementById('nav-store').className = view === 'store' ? 'nav-active flex flex-col items-center gap-1 transition-all' : 'flex flex-col items-center gap-1 opacity-40 transition-all';
            document.getElementById('nav-admin').className = view === 'admin' ? 'nav-active flex flex-col items-center gap-1 transition-all' : 'flex flex-col items-center gap-1 opacity-40 transition-all';
        };

        function renderStore() {
            const grid = document.getElementById('store-grid');
            grid.innerHTML = stockData.length ? '' : '<div class="text-center py-20 opacity-20">NO STOCK_FOUND</div>';
            stockData.forEach(cc => {
                grid.innerHTML += `
                    <div class="glass-panel rounded-xl overflow-hidden">
                        <div class="bg-[#00ff41] text-black text-[10px] font-bold px-3 py-1 flex justify-between">
                            <span>ONLINE_NODE</span>
                            <span>SECURE_DATA</span>
                        </div>
                        <div class="p-5">
                            <span class="text-2xl text-white block mb-2 tracking-widest">${cc.bin}xxxx</span>
                            <div class="flex justify-between text-xs opacity-50 mb-4">
                                <span>PAÍS: ${cc.country}</span>
                                <span>LEVEL: FULLZ</span>
                            </div>
                            <div class="text-right text-[#ff3131] font-bold text-xl mb-4">$ ${cc.price}</div>
                            <button onclick="openModal('${cc.id}')" class="w-full border border-[#00ff41] text-[#00ff41] p-3 rounded-lg font-bold text-xs active:bg-[#00ff41] active:text-black">ORDENAR ACCESO</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- ADMIN ACTIONS ---
        window.unlockAdmin = () => {
            if(document.getElementById('admin-key').value === systemConfig.pass) {
                document.getElementById('admin-gate').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else { notify("Llave Incorrecta", "error"); }
        };

        window.addCardToFirebase = async () => {
            const bin = document.getElementById('in-bin').value;
            const country = document.getElementById('in-country').value;
            const price = document.getElementById('in-price').value;
            
            if(!bin || !price) return notify("BIN y Precio requeridos", "error");

            const btn = document.getElementById('btn-add-stock');
            btn.disabled = true;
            btn.innerText = "SUBIENDO...";

            try {
                const stockCol = collection(db, 'artifacts', APP_ID, 'public', 'data', 'stock');
                await addDoc(stockCol, { bin, country, price, timestamp: Date.now() });
                notify("CC añadida al stock global");
                document.getElementById('in-bin').value = '';
                document.getElementById('in-price').value = '';
            } catch (e) {
                notify("Error al añadir: Verifique Reglas de Firestore", "error");
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerText = "SUBIR A LA NUBE";
            }
        };

        window.deleteCC = async (id) => {
            try {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'stock', id));
                notify("Eliminado del stock");
            } catch (e) { notify("Error al borrar", "error"); }
        };

        function renderAdminList() {
            const list = document.getElementById('admin-list');
            list.innerHTML = '<h4 class="text-[10px] opacity-40 mb-2 uppercase">Stock Actual en Nube</h4>';
            stockData.forEach(cc => {
                list.innerHTML += `
                    <div class="glass-panel p-3 rounded-lg flex justify-between items-center text-xs">
                        <span>${cc.bin} (${cc.country})</span>
                        <button onclick="deleteCC('${cc.id}')" class="text-red-500 font-bold px-2">X</button>
                    </div>
                `;
            });
        }

        window.updateSettings = async () => {
            const phone = document.getElementById('set-phone').value.replace(/\D/g, '');
            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config'), { ...systemConfig, phone });
                notify("Configuración de venta actualizada");
            } catch (e) { notify("Error al guardar ajustes", "error"); }
        };

        // --- FLOW ORDEN ---
        window.openModal = (id) => {
            activeCC = stockData.find(i => i.id === id);
            document.getElementById('order-info').innerHTML = `
                <div><b class="text-[#00ff41]">BIN:</b> ${activeCC.bin}xxxx</div>
                <div><b class="text-[#00ff41]">PAÍS:</b> ${activeCC.country}</div>
                <div class="text-[#ff3131] mt-2 font-bold">TOTAL: $${activeCC.price}</div>
            `;
            document.getElementById('modal-order').classList.remove('hidden');
            document.getElementById('modal-order').classList.add('flex');
        };

        window.closeModal = () => {
            document.getElementById('modal-order').classList.add('hidden');
            document.getElementById('modal-order').classList.remove('flex');
        };

        window.submitToWA = () => {
            const city = document.getElementById('order-city').value;
            if(!city) return notify("Ingrese su ciudad", "error");

            const text = `⚡ *NUEVA ORDEN - SHADOW CC* ⚡
━━━━━━━━━━━━━━━━━━━━━
╭━━ *𝓓𝓮𝓽𝓪𝓵𝓵𝓮𝓼 𝓭𝓮 𝓵𝓪 𝓣𝓪𝓻𝓳𝓮𝓽𝓪* ━━╮
┃
┃ 📟 *BIN:* ${activeCC.bin}xxxx
┃ 🌍 *PAÍS:* ${activeCC.country}
┃ 💰 *PRECIO:* $${activeCC.price}
┃
╰━━━━━━━━━━━━━━━━━━━━╯

╭━━ *𝓘𝓷𝓯𝓸𝓻𝓶𝓪𝓬𝓲𝓸𝓷 𝓭𝓮𝓵 𝓒𝓵𝓲𝓮𝓷𝓽𝓮* ━━╮
┃
┃ 👤 *Email:* ${currentUser.email}
┃ 🏙️ *Ciudad:* ${city}
┃
╰━━━━━━━━━━━━━━━━━━━━╯
━━━━━━━━━━━━━━━━━━━━━
*STATUS: PENDING_CONFIRMATION* 🚩`;

            window.open(`https://api.whatsapp.com/send?phone=${systemConfig.phone}&text=${encodeURIComponent(text)}`, '_blank');
            closeModal();
        };

        window.filterStore = (val) => {
            const term = val.toLowerCase();
            const grid = document.getElementById('store-grid');
            const filtered = stockData.filter(i => i.bin.includes(term) || i.country.toLowerCase().includes(term));
            
            grid.innerHTML = filtered.length ? '' : '<div class="text-center py-20 opacity-20">NO_MATCHES</div>';
            filtered.forEach(cc => {
                grid.innerHTML += `
                    <div class="glass-panel rounded-xl overflow-hidden">
                        <div class="bg-[#00ff41] text-black text-[10px] font-bold px-3 py-1 flex justify-between">
                            <span>ONLINE_NODE</span>
                            <span>SECURE_DATA</span>
                        </div>
                        <div class="p-5">
                            <span class="text-2xl text-white block mb-2 tracking-widest">${cc.bin}xxxx</span>
                            <div class="flex justify-between text-xs opacity-50 mb-4">
                                <span>PAÍS: ${cc.country}</span>
                                <span>LEVEL: FULLZ</span>
                            </div>
                            <div class="text-right text-[#ff3131] font-bold text-xl mb-4">$ ${cc.price}</div>
                            <button onclick="openModal('${cc.id}')" class="w-full border border-[#00ff41] text-[#00ff41] p-3 rounded-lg font-bold text-xs active:bg-[#00ff41] active:text-black">ORDENAR ACCESO</button>
                        </div>
                    </div>
                `;
            });
        };

    </script>
</body>
</html>
