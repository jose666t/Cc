
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW CC - PREMIUM MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --neon: #00ff41;
            --bg: #030303;
            --accent: #ff3131;
            --card-grad: linear-gradient(135deg, #0f172a 0%, #000000 100%);
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Share Tech Mono', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        .premium-font { font-family: 'Orbitron', sans-serif; }

        /* Estilo Tarjeta Física 3D */
        .cc-visual {
            aspect-ratio: 1.58 / 1;
            background: var(--card-grad);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 255, 65, 0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .cc-visual:hover {
            transform: translateY(-5px) rotateX(5deg) rotateY(2deg);
            border-color: var(--neon);
            box-shadow: 0 15px 40px rgba(0, 255, 65, 0.15);
        }

        .cc-chip {
            width: 45px;
            height: 35px;
            background: linear-gradient(135deg, #d4af37 0%, #f1c40f 50%, #b8860b 100%);
            border-radius: 6px;
            position: relative;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .cc-chip::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(90deg, transparent 0, transparent 10px, rgba(0,0,0,0.1) 11px);
        }

        .hacker-card {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        input, select {
            background: #0a0a0a !important;
            border: 1px solid #1a1a1a !important;
            color: var(--neon) !important;
            outline: none;
        }

        .scanline {
            width: 100%; height: 2px;
            background: rgba(0, 255, 65, 0.03);
            position: fixed; top: 0; z-index: 9999;
            pointer-events: none; animation: scan 6s linear infinite;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .nav-link.active {
            color: white;
            text-shadow: 0 0 10px var(--neon);
            opacity: 1;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="pb-24">

    <div class="scanline"></div>

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[10000] w-full max-w-xs space-y-2 px-4"></div>

    <!-- CARGA -->
    <div id="loading" class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <div class="w-14 h-14 border-2 border-zinc-800 border-t-[#00ff41] rounded-full animate-spin mb-6"></div>
        <div class="premium-font text-sm tracking-[0.3em] uppercase animate-pulse">Shadow Terminal Initializing...</div>
    </div>

    <!-- LOGIN -->
    <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="hacker-card w-full max-w-md p-8 rounded-3xl border border-[#00ff41]/20">
            <div class="text-center mb-10">
                <div class="text-6xl mb-4 drop-shadow-[0_0_15px_rgba(0,255,65,0.5)]">💳</div>
                <h1 class="premium-font text-3xl tracking-tighter text-white">SHADOW <span class="text-[#00ff41]">CC</span></h1>
                <p class="text-[9px] opacity-40 uppercase tracking-[0.4em] mt-2">Acceso de Mercado Encriptado</p>
            </div>

            <div class="flex gap-4 mb-8">
                <button onclick="setAuth('login')" id="t-login" class="flex-1 py-2 text-xs font-bold border-b-2 border-[#00ff41]">ACCEDER</button>
                <button onclick="setAuth('signup')" id="t-signup" class="flex-1 py-2 text-xs font-bold border-b-2 border-transparent opacity-40">REGISTRO</button>
            </div>

            <div class="space-y-4">
                <input type="email" id="email" placeholder="Correo Electrónico" class="w-full p-4 rounded-xl text-sm">
                <input type="password" id="pass" placeholder="Contraseña de Seguridad" class="w-full p-4 rounded-xl text-sm">
                <button onclick="handleAuthAction()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-xl uppercase transition-all active:scale-95 shadow-[0_0_20px_rgba(0,255,65,0.3)]">Entrar al Mercado</button>
                
                <div class="flex items-center gap-3 py-2">
                    <div class="flex-grow h-[1px] bg-zinc-800"></div>
                    <span class="text-[9px] opacity-30">O AUTH</span>
                    <div class="flex-grow h-[1px] bg-zinc-800"></div>
                </div>

                <button onclick="loginGoogle()" class="w-full bg-white text-black font-bold p-4 rounded-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> Google
                </button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="view-app" class="hidden animate-in fade-in duration-500">
        <header class="p-6 border-b border-white/5 sticky top-0 bg-black/80 backdrop-blur-xl z-50 flex justify-between items-center">
            <div>
                <h1 class="premium-font text-xl tracking-widest text-white">SHADOW<span class="text-[#00ff41]">CC</span></h1>
                <div id="user-tag" class="text-[8px] opacity-40 uppercase mt-1"></div>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-[#00ff41] animate-ping"></div>
                <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-tighter">Live Stock</span>
            </div>
        </header>

        <main class="p-4 max-w-5xl mx-auto">
            <!-- TIENDA -->
            <section id="sec-store" class="subview space-y-6">
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 opacity-30">🔍</span>
                    <input type="text" id="search" onkeyup="filterStock(this.value)" placeholder="Buscar por BIN, País o Ciudad..." class="w-full p-4 pl-12 rounded-2xl border-none ring-1 ring-white/10 focus:ring-[#00ff41]/50 transition-all">
                </div>

                <div id="marketplace-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Se inyectan las CCs aquí -->
                </div>
            </section>

            <!-- ADMIN -->
            <section id="sec-admin" class="subview hidden">
                <div id="admin-login" class="hacker-card p-10 rounded-3xl text-center border border-zinc-800 max-w-md mx-auto">
                    <h2 class="premium-font text-xl mb-6 text-white tracking-widest">ADMIN PORTAL</h2>
                    <input type="password" id="admin-key" placeholder="••••••••" class="w-full p-4 rounded-xl text-center mb-6 tracking-[10px] text-lg">
                    <button onclick="unlockAdmin()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-xl uppercase shadow-lg shadow-[#00ff41]/20">Unlock Systems</button>
                </div>

                <div id="admin-panel" class="hidden space-y-6">
                    <div class="hacker-card p-6 rounded-3xl border border-white/10">
                        <h3 class="text-white text-[10px] font-bold mb-6 uppercase tracking-[0.2em] border-b border-white/5 pb-4">Añadir Nuevo Inventario</h3>
                        <div class="grid grid-cols-1 gap-4">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="in-bin" placeholder="BIN (6-8 Dígitos)" class="p-4 rounded-xl text-sm">
                                <input type="text" id="in-price" placeholder="Precio ($)" class="p-4 rounded-xl text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="in-country" placeholder="País (Ej: USA 🇺🇸)" class="p-4 rounded-xl text-sm">
                                <input type="text" id="in-city" placeholder="Ciudad / Estado" class="p-4 rounded-xl text-sm">
                            </div>
                            <input type="text" id="in-date" placeholder="Vencimiento (MM/YY)" class="p-4 rounded-xl text-sm">
                            <button onclick="addStockToCloud()" class="w-full bg-[#00ff41] text-black font-bold p-4 rounded-xl uppercase mt-2 active:scale-95">Subir a la Nube</button>
                        </div>
                    </div>

                    <div class="hacker-card p-6 rounded-3xl border border-white/10">
                        <h3 class="text-white text-[10px] font-bold mb-4 uppercase tracking-[0.2em]">WhatsApp de Destino</h3>
                        <div class="flex gap-2">
                            <input type="text" id="config-phone" placeholder="Ej: 50582269592" class="flex-1 p-4 rounded-xl text-sm">
                            <button onclick="savePhone()" class="bg-zinc-800 px-6 rounded-xl font-bold text-xs uppercase hover:bg-zinc-700">Guardar</button>
                        </div>
                    </div>

                    <div id="admin-inventory-list" class="space-y-2"></div>
                </div>
            </section>
        </main>

        <!-- NAV -->
        <nav class="fixed bottom-0 left-0 w-full bg-black/90 backdrop-blur-md border-t border-white/5 flex justify-around p-5 z-[100]">
            <button onclick="changeView('store')" id="nav-store" class="nav-link active flex flex-col items-center gap-1 transition-all">
                <span class="text-xl">💳</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Stock</span>
            </button>
            <button onclick="changeView('admin')" id="nav-admin" class="nav-link flex flex-col items-center gap-1 opacity-30 transition-all">
                <span class="text-xl">🛠️</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Admin</span>
            </button>
            <button onclick="handleLogout()" class="flex flex-col items-center gap-1 opacity-30 text-[#ff3131]">
                <span class="text-xl">🔌</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Desconectar</span>
            </button>
        </nav>
    </div>

    <!-- MODAL -->
    <div id="modal-order" class="fixed inset-0 bg-black/95 z-[6000] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="hacker-card w-full max-w-sm p-8 rounded-[32px] border border-[#00ff41]/30">
            <h2 class="text-white font-bold text-xl mb-6 premium-font tracking-tighter">CHECKOUT SECURE</h2>
            
            <div id="modal-content-info" class="space-y-4 mb-8"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] opacity-40 mb-2 block uppercase tracking-widest">Tu Ciudad de Residencia:</label>
                    <input type="text" id="order-city-input" placeholder="Ej: Managua, NI" class="w-full p-4 rounded-xl text-sm border-none ring-1 ring-white/10">
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 bg-zinc-900 text-zinc-400 p-4 rounded-xl font-bold text-xs uppercase transition-all">Atrás</button>
                    <button onclick="sendToWhatsApp()" class="flex-[2] bg-[#00ff41] text-black p-4 rounded-xl font-bold text-xs uppercase transition-all active:scale-95 shadow-lg shadow-[#00ff41]/20">Solicitar WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // FIREBASE CONFIG - (Cámbialo si usas uno propio)
        const firebaseConfig = {
            apiKey: "AIzaSyC17dzIZSZtMbzu5V7dIHWdm6nDmoBN-KY",
            authDomain: "shadow-music-f033d.firebaseapp.com",
            projectId: "shadow-music-f033d",
            storageBucket: "shadow-music-f033d.firebasestorage.app",
            messagingSenderId: "358954790180",
            appId: "1:358954790180:web:ef7abfb3fc45b291d657b1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_UID = "shadow-cc-v3";

        let authMode = 'login', user = null, stock = [], config = { phone: "50582269592", pass: "admin123" }, currentOrder = null;

        // NOTIF
        window.notify = (msg, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-2xl text-[10px] font-bold border ${isError ? 'bg-red-500/20 border-red-500/50 text-red-500' : 'bg-[#00ff41]/10 border-[#00ff41]/50 text-[#00ff41]'} backdrop-blur-md shadow-2xl animate-bounce`;
            toast.innerText = msg.toUpperCase();
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        };

        // AUTH
        window.setAuth = (mode) => {
            authMode = mode;
            document.getElementById('t-login').className = mode === 'login' ? 'flex-1 py-2 text-xs font-bold border-b-2 border-[#00ff41]' : 'flex-1 py-2 text-xs font-bold border-b-2 border-transparent opacity-40';
            document.getElementById('t-signup').className = mode === 'signup' ? 'flex-1 py-2 text-xs font-bold border-b-2 border-[#00ff41]' : 'flex-1 py-2 text-xs font-bold border-b-2 border-transparent opacity-40';
        };

        window.handleAuthAction = async () => {
            const email = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!email || !p) return notify("Credenciales Vacías", true);
            try { 
                authMode === 'login' ? await signInWithEmailAndPassword(auth, email, p) : await createUserWithEmailAndPassword(auth, email, p); 
                notify("Sistema Accedido");
            } catch(err) { notify(err.message, true); }
        };

        window.loginGoogle = async () => {
            try { await signInWithPopup(auth, new GoogleAuthProvider()); }
            catch(err) { notify("Error Auth Google", true); }
        };

        window.handleLogout = () => signOut(auth);

        // STATE
        onAuthStateChanged(auth, (u) => {
            user = u;
            document.getElementById('loading').style.display = 'none';
            if(u) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                document.getElementById('user-tag').innerText = `NODE: ${u.email.split('@')[0]}`;
                syncCloud();
            } else {
                document.getElementById('view-app').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        });

        function syncCloud() {
            onSnapshot(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), (s) => {
                if(s.exists()) {
                    config = s.data();
                    document.getElementById('config-phone').value = config.phone;
                } else {
                    setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), config);
                }
            });

            onSnapshot(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), (s) => {
                stock = s.docs.map(d => ({id: d.id, ...d.data()}));
                renderStoreGrid(stock);
                renderAdminView();
            });
        }

        // NAVIGATION
        window.changeView = (v) => {
            document.querySelectorAll('.subview').forEach(x => x.classList.add('hidden'));
            document.getElementById('sec-'+v).classList.remove('hidden');
            document.getElementById('nav-store').classList.toggle('opacity-30', v !== 'store');
            document.getElementById('nav-store').classList.toggle('active', v === 'store');
            document.getElementById('nav-admin').classList.toggle('opacity-30', v !== 'admin');
            document.getElementById('nav-admin').classList.toggle('active', v === 'admin');
        };

        // RENDER CARDS
        function renderStoreGrid(data) {
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = data.length ? '' : '<div class="col-span-full py-20 text-center opacity-20 text-xs tracking-[0.5em]">OUT_OF_STOCK</div>';
            
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="hacker-card p-4 rounded-[24px] border border-white/5 space-y-4">
                        <div class="cc-visual p-6 flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div class="cc-chip shadow-inner"></div>
                                <div class="text-[10px] text-white/50 premium-font italic uppercase">Shadow Premium</div>
                            </div>
                            
                            <div class="mt-4">
                                <div class="text-[8px] uppercase tracking-[0.3em] text-white/30 mb-1">Secure BIN</div>
                                <div class="text-xl md:text-2xl text-white font-mono tracking-[0.2em] drop-shadow-lg">
                                    ${item.bin.slice(0,4)} ${item.bin.slice(4,8)} **** ****
                                </div>
                            </div>

                            <div class="flex justify-between items-end">
                                <div class="flex-1 overflow-hidden pr-4">
                                    <div class="text-[7px] uppercase text-white/30 tracking-widest">Region / City</div>
                                    <div class="text-[10px] text-[#00ff41] truncate font-bold uppercase">${item.city} | ${item.country}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[7px] uppercase text-white/30 tracking-widest">Exp</div>
                                    <div class="text-[11px] text-white font-mono">${item.expDate}</div>
                                </div>
                            </div>
                            
                            <!-- Reflection effect -->
                            <div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent pointer-events-none"></div>
                        </div>

                        <div class="flex items-center justify-between gap-4 px-1">
                            <div>
                                <span class="text-[8px] block opacity-40 uppercase tracking-widest">Price</span>
                                <span class="text-xl font-bold text-[#ff3131] premium-font">$${item.price}</span>
                            </div>
                            <button onclick="openCheckout('${item.id}')" class="flex-1 bg-[#00ff41] text-black text-[10px] font-bold py-3 rounded-xl uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-[#00ff41]/10">
                                Comprar Ahora
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // ADMIN
        window.unlockAdmin = () => {
            if(document.getElementById('admin-key').value === config.pass) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                notify("Sistemas Desbloqueados");
            } else { notify("Acceso Denegado", true); }
        };

        window.addStockToCloud = async () => {
            const bin = document.getElementById('in-bin').value;
            const country = document.getElementById('in-country').value;
            const city = document.getElementById('in-city').value;
            const expDate = document.getElementById('in-date').value;
            const price = document.getElementById('in-price').value;

            if(!bin || !price || !city) return notify("Faltan Datos", true);

            try {
                await addDoc(collection(db, 'artifacts', APP_UID, 'public', 'data', 'stock'), {
                    bin, country, city, expDate, price, timestamp: Date.now()
                });
                notify("Item Publicado");
                ['in-bin', 'in-price', 'in-city', 'in-date'].forEach(id => document.getElementById(id).value = '');
            } catch (e) { notify("Error de Escritura", true); }
        };

        window.deleteCC = async (id) => {
            if(confirm("¿Eliminar del inventario global?")) {
                await deleteDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'stock', id));
                notify("Item Removido");
            }
        };

        function renderAdminView() {
            const list = document.getElementById('admin-inventory-list');
            list.innerHTML = '<h4 class="text-[9px] opacity-20 mt-4 mb-2 uppercase tracking-widest">Lista de Control</h4>';
            stock.forEach(item => {
                list.innerHTML += `
                    <div class="glass-effect p-3 rounded-xl flex justify-between items-center text-[10px] border border-white/5">
                        <span class="text-white/60">${item.bin} - ${item.city}</span>
                        <button onclick="deleteCC('${item.id}')" class="text-[#ff3131] px-2 font-bold hover:scale-125 transition-transform">BORRAR</button>
                    </div>
                `;
            });
        }

        window.savePhone = async () => {
            const phone = document.getElementById('config-phone').value.replace(/\D/g, '');
            await setDoc(doc(db, 'artifacts', APP_UID, 'public', 'data', 'settings', 'config'), { ...config, phone });
            notify("Teléfono Guardado");
        };

        // CHECKOUT & WHATSAPP
        window.openCheckout = (id) => {
            currentOrder = stock.find(i => i.id === id);
            document.getElementById('modal-content-info').innerHTML = `
                <div class="bg-black/50 p-6 rounded-2xl border border-white/5 space-y-3">
                    <div class="flex justify-between items-center border-b border-white/5 pb-2">
                        <span class="text-[10px] opacity-40 uppercase">Card BIN</span>
                        <span class="text-[#00ff41] font-mono font-bold">${currentOrder.bin}xxxx</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-white/5 pb-2">
                        <span class="text-[10px] opacity-40 uppercase">Location</span>
                        <span class="text-white text-xs">${currentOrder.city}, ${currentOrder.country}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2">
                        <span class="text-xs font-bold text-white uppercase">Monto a Pagar:</span>
                        <span class="text-xl font-bold text-[#ff3131]">$${currentOrder.price}</span>
                    </div>
                </div>
            `;
            document.getElementById('modal-order').classList.remove('hidden');
            document.getElementById('modal-order').classList.add('flex');
        };

        window.closeModal = () => {
            document.getElementById('modal-order').classList.add('hidden');
            document.getElementById('modal-order').classList.remove('flex');
        };

        window.sendToWhatsApp = () => {
            const clientCity = document.getElementById('order-city-input').value;
            if(!clientCity) return notify("Ingresa tu ciudad de envío", true);

            const msg = `⚡ *NUEVA ORDEN - SHADOW MARKET* ⚡
━━━━━━━━━━━━━━━━━━━━━
╭━━ *𝓓𝓮𝓽𝓪𝓵𝓵𝓮𝓼 𝓭𝓮 𝓵𝓪 𝓒𝓒* ━━╮
┃
┃ 📟 *BIN:* ${currentOrder.bin}xxxx
┃ 🏙️ *CIUDAD:* ${currentOrder.city}
┃ 📅 *FECHA:* ${currentOrder.expDate}
┃ 🌍 *PAÍS:* ${currentOrder.country}
┃ 💰 *PRECIO:* $${currentOrder.price}
┃
╰━━━━━━━━━━━━━━━━━━━━╯

╭━━ *𝓒𝓵𝓲𝓮𝓷𝓽𝓮* ━━╮
┃
┃ 👤 *ID:* ${user.email}
┃ 🏙️ *ENVÍO A:* ${clientCity}
